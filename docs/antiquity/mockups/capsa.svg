<text x="680" y="76" text-anchor="middle" font-size="20" font-family="'DejaVu Sans',Verdana,sans-serif" font-weight="700" fill="#E2A93A">Laurel Wreath</text><text x="680" y="98" text-anchor="middle" font-size="12" font-family="'DejaVu Sans',Verdana,sans-serif" font-weight="700" fill="#F4EAD9">A suit</text>
<text x="490" y="142" font-size="13" font-family="'DejaVu Sans',Verdana,sans-serif" font-weight="700" fill="#F4EAD9">Glide after a run-up.</text>
<text x="490" y="164" font-size="13" font-family="'DejaVu Sans',Verdana,sans-serif" font-weight="700" fill="#F4EAD9">Spin to stun enemies and bonk blocks.</text>
<text x="490" y="186" font-size="13" font-family="'DejaVu Sans',Verdana,sans-serif" font-weight="700" fill="#F4EAD9">You keep it until you are hit.</text>
<text x="490" y="208" font-size="13" font-family="'DejaVu Sans',Verdana,sans-serif" font-weight="700" fill="#F4EAD9">Given by: Muse Calliope</text>
<rect x="488" y="214" width="140" height="36" rx="12" fill="#E2A93A" stroke="#17141F" stroke-width="3"/><text x="558.0" y="238.0" text-anchor="middle" font-size="16" font-family="'DejaVu Sans',Verdana,sans-serif" font-weight="700" fill="#17141F">WEAR IT</text>
<rect x="640" y="214" width="140" height="36" rx="12" fill="#F4EAD9" stroke="#17141F" stroke-width="3"/><text x="710.0" y="238.0" text-anchor="middle" font-size="16" font-family="'DejaVu Sans',Verdana,sans-serif" font-weight="700" fill="#17141F">PUT IN NICHE</text>
<rect x="44" y="340" width="100" height="36" rx="12" fill="#F4EAD9" stroke="#17141F" stroke-width="3"/><text x="94" y="364" text-anchor="middle" font-size="16" font-family="'DejaVu Sans',Verdana,sans-serif" font-weight="700" fill="#17141F">BACK</text>
<text x="470" y="290" font-size="11" font-family="'DejaVu Sans',Verdana,sans-serif" font-weight="700" fill="#17141F">Tap an item to see it.</text><text x="470" y="308" font-size="11" font-family="'DejaVu Sans',Verdana,sans-serif" font-weight="700" fill="#17141F">“Wear it” starts the next scene in that suit.</text><text x="470" y="326" font-size="11" font-family="'DejaVu Sans',Verdana,sans-serif" font-weight="700" fill="#17141F">“Put in Niche” carries it as your reserve.</text></svg>